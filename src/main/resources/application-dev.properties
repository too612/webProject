# Database Configuration (dev)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/DEV}
spring.datasource.username=${DB_USERNAME:DEV}
spring.datasource.password=${DB_PASSWORD:dev}

# CORS Configuration (React dev server)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging Configuration (dev)
logging.level.com.main.app=DEBUG
logging.level.org.mybatis.spring=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.com.main.app.common.auth=DEBUG

# MyBatis SQL 로깅 상세
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Mail Configuration (dev)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:too0524@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${APP_MAIL_FROM:too0524@gmail.com}

# Enable only after applying the scheduler and assignment migrations.
app.scheduler.enabled=${APP_SCHEDULER_ENABLED:false}
app.scheduler.reload-delay-ms=${APP_SCHEDULER_RELOAD_DELAY_MS:300000}
app.scheduler.initial-delay-ms=${APP_SCHEDULER_INITIAL_DELAY_MS:30000}
app.scheduler.zone=${APP_SCHEDULER_ZONE:Asia/Seoul}

# 개발 편의 설정 (운영에 반영하지 않는다)
# 소스 변경 시 자동 재시작
spring.devtools.restart.enabled=true
# 정적 리소스 변경 즉시 반영
spring.devtools.livereload.enabled=true
# 개발 중 브라우저 캐시 방지
spring.web.resources.cache.period=0
# dev 프로파일에서만 Spring Security 전체 허용 (prod 에서는 적용되지 않는다)
app.security.dev-permit-all=true
# 과거 평문 비밀번호 계정 호환 (로컬 데이터 호환용)
app.security.allow-plaintext-password=true
