# Database Configuration (prod)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# CORS Configuration (prod)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Logging Configuration (prod)
logging.level.com.main.app=INFO
logging.level.org.mybatis.spring=INFO
logging.level.org.springframework.web=INFO

# 운영에서는 SQL stdout 출력 비활성화
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# Mail Configuration (prod)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Enable only after applying the scheduler and assignment migrations.
app.scheduler.enabled=${APP_SCHEDULER_ENABLED:false}
app.scheduler.reload-delay-ms=${APP_SCHEDULER_RELOAD_DELAY_MS:300000}
app.scheduler.initial-delay-ms=${APP_SCHEDULER_INITIAL_DELAY_MS:30000}
app.scheduler.zone=${APP_SCHEDULER_ZONE:Asia/Seoul}

# Security Configuration (prod)
# 세션 쿠키는 HTTPS 전용으로 발급한다. 평문 HTTP 로 운영해야 하는 경우에만 APP_SESSION_COOKIE_SECURE=false 로 완화한다.
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
app.security.dev-permit-all=false
app.security.allow-plaintext-password=${APP_ALLOW_PLAINTEXT_PASSWORD:false}
app.security.session.revalidate-ms=${APP_SESSION_REVALIDATE_MS:60000}
