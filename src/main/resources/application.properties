spring.application.name=app

# 기본 프로파일 (운영 배포 시 반드시 SPRING_PROFILES_ACTIVE=prod 를 지정한다)
# SecurityConfig 는 dev 프로파일에서만 app.security.dev-permit-all 전체 허용을 적용하고,
# 그 외 프로파일(prod/미지정 값)은 인증·인가를 강제한다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# Session / Cookie 보안 정책 (전 프로파일 공통 기본값)
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# YouTube Live API
# API 키는 환경변수 YOUTUBE_API_KEY로만 주입합니다.
youtube.api-key=${YOUTUBE_API_KEY}
# 실시간 라이브 방송을 조회할 유튜브 채널 ID (다사랑교회 @dsr87450)
youtube.channel-id=${YOUTUBE_CHANNEL_ID:UCkGtpE-xZYg4X6HWTEnH89w}

# 개발 편의(자동 재시작·LiveReload·정적 리소스 무캐시) 설정은 application-dev.properties 로 이동했다.

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.main.app.common.dto,com.main.app.common.auth.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Logging Configuration
logging.level.root=INFO
logging.file.name=logs/company-website.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Static Resources Configuration
# 정적 리소스는 클래스패스(static)만 노출한다.
# (이전 설정 classpath:/static/,file:./ 는 프로젝트 루트 전체를 /** 로 노출해
#  /logs/company-website.log, /src/**, /build.gradle 등이 무인증으로 내려갔다)
spring.web.resources.static-locations=classpath:/static/

# File Upload Configuration (용량은 환경변수로 조정)
spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:200MB}
app.upload.path=./data/

# Chatbot moderation
chatbot.moderation.blocked-words=${CHATBOT_BLOCKED_WORDS:시발,개새끼}

# Mail Configuration
app.mail.from=${APP_MAIL_FROM:too0524@gmail.com}

# Security Configuration
# 세션 유효성(계정 상태) 재검증 주기. 0 이면 매 요청마다 DB 를 조회한다.
app.security.session.revalidate-ms=${APP_SESSION_REVALIDATE_MS:60000}
# 평문으로 저장된 과거 비밀번호 로그인 호환 여부 (운영 기본 비활성)
app.security.allow-plaintext-password=${APP_ALLOW_PLAINTEXT_PASSWORD:false}
# dev 프로파일에서만 사용하는 전체 허용 스위치 (운영에서는 무시된다)
app.security.dev-permit-all=false
