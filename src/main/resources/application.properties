spring.application.name=app

# 기본 프로파일 (운영은 SPRING_PROFILES_ACTIVE=prod 권장)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# YouTube Live API
# 기본값으로 기존 키를 사용합니다. 운영/배포 환경에서는 환경변수 YOUTUBE_API_KEY로 교체하는 것을 권장합니다.
youtube.api-key=${YOUTUBE_API_KEY:AIzaSyAP7K7PLkvWDb1-4fn4fj8dWroqw6Ftr3s}
# 실시간 라이브 방송을 조회할 유튜브 채널 ID (다사랑교회 @dsr87450)
youtube.channel-id=${YOUTUBE_CHANNEL_ID:UCkGtpE-xZYg4X6HWTEnH89w}

# 소스파일에 변화가 있을 때 자동으로 서버 재 시작 설정
spring.devtools.restart.enabled=true

# 정적 리소스에 변화가 있을 때 바로 반영한다.
spring.devtools.livereload.enabled=true

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.main.app.common.dto,com.main.app.common.auth.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Logging Configuration
logging.level.root=INFO
logging.file.name=logs/company-website.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/,file:./
spring.web.resources.cache.period=0

# File Upload Configuration
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.upload.path=./data/

# Mail Configuration
app.mail.from=${APP_MAIL_FROM:too0524@gmail.com}
